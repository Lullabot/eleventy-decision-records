name: Run Playwright tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  # Packs the theme once so every downstream job installs the exact bytes
  # that would be published. A file: dependency would symlink the working
  # tree instead, leaving the "files" and "exports" fields untested.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # npm pack runs the prepare script, so dependencies must be present.
      - run: npm ci
      # npm pack will not create its destination directory.
      - run: mkdir -p dist-package && npm pack --pack-destination dist-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: theme-package
          path: dist-package/*.tgz
          retention-days: 7

  run-playwright:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eleventy:
          # The lockfile pin, which Renovate keeps on the latest 3.x.
          - name: v3
            version: ''
            experimental: false
          # The 4.x prerelease line, published under the canary tag. A
          # failure here is reported but does not block the PR.
          - name: v4
            version: canary
            experimental: true
    name: run-playwright (${{ matrix.eleventy.name }})
    continue-on-error: ${{ matrix.eleventy.experimental }}
    env:
      ELEVENTY_VERSION: ${{ matrix.eleventy.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The fixture site installs from this tarball rather than packing
      # again, so the suite and the published artifact cannot drift.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: theme-package
          path: dist-package
      # Builds the fixture under several consumer configurations. Fast and
      # browserless, so it runs before the Docker suite.
      - run: npm run test:config
      # Runs the suite in the same Docker image used for local snapshot
      # generation, so visual baselines match exactly.
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.eleventy.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
