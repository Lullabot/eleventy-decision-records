services:
  # What to call the service hosting the site. Because there is only
  # one service, it is automatically set as the default service, which
  # does a few things
  #   1. Clones the git repository into the service container
  #   2. Exposes port 80 to the Tugboat HTTP proxy
  #   3. Routes requests to the preview URL to this service
  apache:
    # Use the available version of Apache by not specifying a version
    image: tugboatqa/httpd

    # A set of commands to run while building this service
    commands:
      # Commands that set up the basic preview infrastructure
      init:
        # Link the document root to the expected path. The preview serves
        # the fixture site, which consumes the theme the way a real
        # project does, so the docroot is that site's Eleventy output.
        - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
        - ln -snf "${TUGBOAT_ROOT}/tests/fixture-site/_site" "${DOCROOT}"
        - apt-get install -y nodejs
      build:
        - npm ci
        # Packs the theme and installs the tarball into the fixture site,
        # matching what the Playwright suite builds.
        - bash bin/prepare-fixture-site.sh
        # --prefix runs the script with the fixture site as its working
        # directory, which the plugin needs to resolve Nunjucks through
        # that project's own Eleventy.
        - npm --prefix tests/fixture-site run build
